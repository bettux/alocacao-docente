<div id="prof-view">
<div class="toolbar"><div><h1>Professores</h1><span class="muted">Cadastro e associação de disciplinas • As alocações na grade serão desenvolvidas na próxima etapa.</span></div><span class="pill" id="counter">0 professores</span></div>
<div class="grid">
<section class="card"><h2 id="form-title">Cadastrar professor</h2><form id="teacher-form"><input id="teacher-id" type="hidden"/><div class="field"><label for="teacher-name">Nome completo</label><input id="teacher-name" maxlength="200" required=""/></div><div class="field"><label for="teacher-nif">NIF</label><input id="teacher-nif" maxlength="50" required=""/></div><div class="field"><label for="teacher-color">Cor do professor</label><div class="inline-color"><input id="teacher-color" type="color" value="#2563eb"/><span class="muted">A mesma cor será usada nas grades.</span></div></div><div class="field"><label><input checked="" id="teacher-active" style="width:auto" type="checkbox"/> Professor ativo</label></div><div class="actions"><button class="btn primary" id="save-teacher" type="submit">Salvar professor</button><button class="btn" id="cancel-edit" type="button">Limpar formulário</button></div></form></section>
<section class="card"><div class="toolbar"><h2 style="margin:0">Professores cadastrados</h2><button class="btn" id="refresh" type="button">Atualizar</button></div><div class="field"><label for="search">Buscar professor</label><input id="search" placeholder="Digite o nome"/></div><div class="list" id="teacher-list"><p class="muted">Carregando...</p></div></section>
</div>
<section class="card hidden" id="association" style="margin-top:20px"><div class="toolbar"><div><h2 style="margin:0">Disciplinas do professor</h2><p class="muted" id="association-name"></p></div><button class="btn" id="close-association" type="button">Fechar</button></div><div class="field"><label for="subject-search">Pesquisar disciplinas</label><input id="subject-search" placeholder="Ex.: Banco de Dados"/></div><p class="count" id="subject-count"></p><div class="subjectlist" id="subject-list"></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="save-subjects" type="button">Salvar associações</button></div></section>
</div>
